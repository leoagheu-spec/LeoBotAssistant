<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="LeoBotAssist: a little ball bot that answers your questions.">
  <title>LeoBotAssist</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="home">
    <button id="ball" type="button" aria-label="Hello I'm Leo bot">
      <span class="eye"></span>
      <span class="eye"></span>
    </button>
    <h1>Hello I'm Leo bot</h1>
    <p class="hint" id="hint">Tap me to start</p>
    <div class="actions">
      <button id="install" type="button" hidden>Install app</button>
      <button id="share" type="button">Share with friends</button>
    </div>
  </main>

  <section id="chat" hidden>
    <header>
      <span class="mini-ball"><i></i><i></i></span>
      <strong>LeoBotAssist</strong>
      <span id="counter"></span>
    </header>
    <div id="messages" aria-live="polite"></div>
    <form id="form" autocomplete="off">
      <input id="question" type="text" placeholder="Ask me something..." required>
      <button id="send" type="submit">Send</button>
    </form>
  </section>

  <div id="alarm" role="alert" hidden>
    <p id="alarm-text">Jarvis, execute self-destroy</p>
    <div id="alarm-count">5</div>
  </div>

  <div id="crash" hidden>
    <h2>LeoBotAssist has stopped working</h2>
    <p>Leo bot is gone. Maybe he'll be back tomorrow.</p>
    <button id="restart" type="button">Restart app</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
